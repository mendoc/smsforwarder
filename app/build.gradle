plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dimitriongoua.smsforwarder'
    compileSdk 33

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.dimitriongoua.smsforwarder"
        minSdk 24
        targetSdk 33
        versionCode 132
        versionName "1.3.2"
        // Suffixe SemVer fourni par le CI (-dev.N+sha sur main, -pr.P.N+sha en PR, rien en release)
        versionNameSuffix System.getenv('VERSION_SUFFIX') ?: null

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "BOT_TOKEN", "\"${System.getenv('BOT_TOKEN') ?: 'default_value'}\""
        buildConfigField "String", "CHAT_ID", "\"${System.getenv('CHAT_ID') ?: 'default_value'}\""
        // Secret de POST /sms/incoming : même valeur que SMS_INGEST_TOKEN dans Netlify.
        buildConfigField "String", "SMS_INGEST_TOKEN", "\"${System.getenv('SMS_INGEST_TOKEN') ?: 'default_value'}\""
    }

    // Clé de signature fixe, fournie par le CI (secrets SIGNING_*). Sans elle, chaque build
    // du CI est signé avec une clé de debug neuve : l'APK ne peut pas mettre à jour le
    // précédent, et ANDROID_ID (donc l'identifiant du téléphone dans Miango) change.
    def signingKeystore = System.getenv('SIGNING_KEYSTORE_PATH')
    signingConfigs {
        if (signingKeystore) {
            fixed {
                storeFile file(signingKeystore)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (signingKeystore) signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.android.volley:volley:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}