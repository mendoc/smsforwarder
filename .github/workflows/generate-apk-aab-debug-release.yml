name: Generated APK AAB (Upload - Create Artifact To Github Action)

env:
  # The name of the main module repository
  main_project_module: app

  # The name of the Play Store
  playstore_name: SMS Forwarder

on:

  # Livraisons (tags v<versionName>, ex. v1.4.1) et builds d'intégration (main)
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

  # Le développement se fait sur main via des PR : chaque PR compile l'APK (artefact joint)
  pull_request:
    branches:
      - 'main'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    # contents: write pour publier les captures d'écran (branche screenshots/<branche>) et
    # créer la Release GitHub d'un tag.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Set Current Date As Env Variable
      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # Set Repository Name As Env Variable
      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '17'
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      # Clé de signature fixe (secret SIGNING_KEYSTORE_BASE64 + SIGNING_STORE_PASSWORD,
      # SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD) : l'APK met à jour le précédent sans
      # désinstallation et l'identifiant du téléphone reste le même. Sans ce secret, clé de
      # debug générée par le runner (différente à chaque build).
      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/smsforwarder.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/smsforwarder.keystore" >> $GITHUB_ENV
            echo "Clé de signature fixe utilisée."
          else
            echo "::warning::Secret SIGNING_KEYSTORE_BASE64 absent : APK signé avec une clé de debug temporaire."
          fi

      # Version et type de build selon l'origine (VERSION_SUFFIX lu par app/build.gradle) :
      #   tag v*      -> aucun suffixe, APK release (livraison : 1.4.1)
      #   PR          -> -pr.<PR>.<run>+<sha>, APK debug (jetable)
      #   main/manuel -> -dev.<run>+<sha>, APK debug (build d'intégration)
      # versionCode inchangé : la livraison s'installe toujours par-dessus un APK de test.
      # Un tag doit valoir « v » + versionName : sinon le build échoue au lieu de livrer
      # une version mal étiquetée.
      - name: Compute version suffix
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' ${{ env.main_project_module }}/build.gradle | head -n 1)
          if [ -z "$version" ]; then echo "versionName introuvable dans ${{ env.main_project_module }}/build.gradle" >&2; exit 1; fi
          echo "app_version=$version" >> $GITHUB_ENV
          build_type=debug
          case "$GITHUB_REF" in
            refs/tags/*)
              if [ "$GITHUB_REF_NAME" != "v$version" ]; then
                echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à versionName $version (attendu : v$version)."
                exit 1
              fi
              if [ -z "$SIGNING_KEYSTORE_PATH" ]; then
                echo "::error::Livraison impossible sans la clé de signature fixe (secret SIGNING_KEYSTORE_BASE64)."
                exit 1
              fi
              suffix=""
              build_type=release ;;
            *)
              if [ -n "$PR_NUMBER" ]; then pre="pr.${PR_NUMBER}.${GITHUB_RUN_NUMBER}"; else pre="dev.${GITHUB_RUN_NUMBER}"; fi
              suffix="-${pre}+${HEAD_SHA::7}" ;;
          esac
          echo "VERSION_SUFFIX=$suffix" >> $GITHUB_ENV
          echo "build_type=$build_type" >> $GITHUB_ENV
          # Sans les métadonnées « +sha » dans le nom de fichier
          echo "apk_suffix=${suffix%%+*}" >> $GITHUB_ENV
          echo "Version : $version${suffix} (APK $build_type)"

      # Run Build Project
      - name: Build gradle project
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SMS_INGEST_TOKEN: ${{ secrets.SMS_INGEST_TOKEN }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew build

      # APK debug (PR, main) ou release (tag), signé avec la même clé fixe
      - name: Build apk ${{ env.build_type }} (APK) - ${{ env.main_project_module }} module
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SMS_INGEST_TOKEN: ${{ secrets.SMS_INGEST_TOKEN }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ "$build_type" = release ]; then ./gradlew assembleRelease; else ./gradlew assembleDebug; fi

      # Renomme l'APK avec la version de l'application (versionName de app/build.gradle)
      - name: Rename APK with app version
        run: |
          version="$app_version"
          apk=$(ls ${{ env.main_project_module }}/build/outputs/apk/$build_type/*.apk | head -n 1)
          if [ -z "$apk" ]; then echo "Aucun APK $build_type produit." >&2; exit 1; fi
          mkdir -p dist
          cp "$apk" "dist/sms-forwarder-$version$apk_suffix.apk"
          echo "apk_name=sms-forwarder-$version$apk_suffix" >> $GITHUB_ENV
          ls -l dist

      # Upload Artifact Build : artefact sms-forwarder-<version><suffixe> contenant l'APK du même nom
      - name: Upload APK - ${{ env.repository_name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.apk_name }}
          path: dist/${{ env.apk_name }}.apk
          if-no-files-found: error

      # Release GitHub du tag : notes générées à partir des PR fusionnées depuis le tag
      # précédent (rubriques dans .github/release.yml) et APK release joint.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release déjà créée depuis l'interface GitHub (qui crée aussi le tag) : on y joint
          # l'APK ; sinon, on la crée avec des notes générées.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/${apk_name}.apk" --repo "$GITHUB_REPOSITORY" --clobber
            echo "APK joint à la Release existante $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" "dist/${apk_name}.apk" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --title "SMS Forwarder $app_version"
            echo "Release $GITHUB_REF_NAME publiée avec dist/${apk_name}.apk"
          fi

      # Envoi de l'APK sur Telegram pour les livraisons (tags v*) et les lancements
      # manuels, pas pour les PR ni les push sur main. Secrets TELEGRAM_BOT_TOKEN et TELEGRAM_CHAT_ID, à défaut
      # BOT_TOKEN et CHAT_ID (ceux déjà utilisés par l'app). Sans secret, l'étape est
      # ignorée avec un avertissement.
      - name: Send APK to Telegram
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Secrets Telegram absents : APK non envoyé sur Telegram."
            exit 0
          fi
          caption="SMS Forwarder ${apk_name#sms-forwarder-} · ${GITHUB_REF_NAME} · ${GITHUB_SHA::7}"
          curl -sS --fail-with-body -o /dev/null \
            --form-string chat_id="$TELEGRAM_CHAT_ID" \
            --form-string caption="$caption" \
            -F document=@"dist/${apk_name}.apk" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
          echo "APK envoyé sur Telegram : $caption"

      # Captures d'écran des tests Robolectric (app/build/screenshots, voir JournalScreenshotTest),
      # même si un test échoue : publiées seules sur la branche screenshots/<branche de la PR>,
      # réécrite à chaque run, pour les comparer à la maquette sans téléphone.
      # Pas pour les tags : leurs captures sont celles du commit déjà publié sur main.
      - name: Publish screenshots
        if: always() && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          shots=app/build/screenshots
          if ! ls "$shots"/*.png >/dev/null 2>&1; then echo "Aucune capture d'écran."; exit 0; fi
          target="screenshots/${BRANCH_NAME}"
          work="$RUNNER_TEMP/screenshots"
          mkdir -p "$work" && cp "$shots"/*.png "$work/"
          cd "$work"
          printf 'Captures de %s (%s), run %s\n' "$BRANCH_NAME" "${HEAD_SHA::7}" "$GITHUB_RUN_NUMBER" > README.md
          git init -q -b "$target"
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Captures ${HEAD_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${target}"
          echo "Captures publiées sur la branche ${target} :" && ls *.png
